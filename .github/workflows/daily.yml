name: Daily Contribution

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Activity File
        run: |
          echo "Last Updated: $(date)" > activity.txt

      - name: Commit and Push Changes
        run: |
          git config user.name "naifsheikh0808-collab"
          git config user.email "naifsheikh0808@gmail.com"
          git add activity.txt
          git commit -m "Daily contribution update" || exit 0
          git push
